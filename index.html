<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monochrome Player Custom</title>
<link rel="stylesheet" href="style.css">
<!-- Shaka Player CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.7/shaka-player.compiled.js"></script>
</head>
<body>
  <div class="container">
    <h1>Monochrome Player Custom</h1>

    <!-- Barra di ricerca -->
    <div class="search">
      <input type="text" id="searchBox" placeholder="Cerca un brano...">
      <button onclick="search()">Cerca</button>
    </div>

    <!-- Lista risultati -->
    <div id="results" class="results"></div>

    <!-- Player FLAC semplice -->
    <audio id="simpleAudioPlayer" controls style="display:none"></audio>

    <!-- Player DASH (Hi-Res) -->
    <div id="dashVideoContainer" style="display:none">
      <video id="dashVideoPlayer" controls width="100%"></video>
    </div>

    <!-- Link per download FLAC -->
    <a id="flacDownloadLink" style="display:none"></a>
  </div>

  <!-- Il tuo file player.js -->
  <script src="player.js"></script>
</body>
</html>
